server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker interne — évite le crash "host not found" au démarrage
    # si le backend n'est pas encore prêt. valid=10s = re-resolve toutes les 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Variable obligée pour activer la résolution lazy avec resolver
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Assets dynamiques (portraits traders + bannières modes)
    location /images/traders-dynamic/ {
        alias /usr/share/nginx/html/images/traders-dynamic/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
